name: "Stepshots Record"
description: "Record, verify, and tour-check interactive product demos with Stepshots CLI"
branding:
  icon: "camera"
  color: "gray-dark"

inputs:
  command:
    description: "What to run: record (capture bundles), verify (drift check, writes no bundles), or tour-check (replay tour files against a live deploy)"
    required: false
    default: "record"
  config:
    description: "Path to stepshots.config.json"
    required: false
    default: "stepshots.config.json"
  tutorials:
    description: "Comma-separated tutorial keys to record or verify (default: all)"
    required: false
  output:
    description: "Output directory for .stepshot bundles (record) or failure screenshots and the report (verify, tour-check)"
    required: false
    default: "output"
  fail-on:
    description: "verify/tour-check: fail the step on 'fail' (broken steps) or 'warn' (also annotation or fallback-anchor drift)"
    required: false
    default: "fail"
  on-drift:
    description: "verify only: 'fail' fails the step; 'pull-request' re-records the affected tutorials into bundles-dir, renders contact sheets, and opens (or updates) a pull request with them. Needs contents: write and pull-requests: write"
    required: false
    default: "fail"
  bundles-dir:
    description: "verify with on-drift: pull-request — the committed directory holding your .stepshot bundles; re-recorded bundles and their contact sheets are written here"
    required: false
    default: "output"
  pr-token:
    description: "verify with on-drift: pull-request — token that pushes the branch and opens the PR. PRs opened with the default GITHUB_TOKEN do not trigger other workflows; pass a PAT or app token if they must"
    required: false
    default: ${{ github.token }}
  url:
    description: "tour-check only: base URL of the deploy to replay tours against (required)"
    required: false
  tours:
    description: "tour-check only: comma-separated tour files or directories to check (default: tours/)"
    required: false
  update-fallbacks:
    description: "tour-check only: refresh each step's text/aria fallback anchors from the live DOM and rewrite the tour files (commit the changes in a later step)"
    required: false
    default: "false"
  upload:
    description: "Upload bundles after recording"
    required: false
    default: "false"
  token:
    description: "Stepshots API token (required if upload is true). With verify, also reports each result to the dashboard demo named by the tutorial's demoId"
    required: false
  server:
    description: "Stepshots server URL"
    required: false
    default: "https://stepshots.com"
  demo-id:
    description: "Replace an existing demo instead of creating a new one"
    required: false
  title:
    description: "Override the demo title on upload"
    required: false
  version:
    description: "Stepshots CLI version to install: 'latest' for the newest published release, a release tag (e.g. v1.5.0), or a git branch/SHA. Tags install a prebuilt binary; git refs build from source."
    required: false
    default: "latest"
  github-token:
    description: "Token used to resolve the latest release tag (avoids anonymous API rate limits)"
    required: false
    default: ${{ github.token }}

outputs:
  bundles:
    description: "Newline-separated list of recorded .stepshot files (record command only)"
    value: ${{ steps.record.outputs.bundles }}
  report:
    description: "Path to the JSON report (verify and tour-check commands only)"
    value: ${{ steps.verify.outputs.report || steps.tour_check.outputs.report }}
  pull-request-url:
    description: "URL of the pull request opened for drifted demos (verify with on-drift: pull-request)"
    value: ${{ steps.drift_pr.outputs.pull-request-url }}

runs:
  using: "composite"
  steps:
    - name: Install Stepshots CLI
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: hauju/stepshots
      run: |
        set -euo pipefail

        VERSION="$INPUT_VERSION"

        if [ "$VERSION" = "latest" ]; then
          VERSION="$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/releases/latest" \
            | jq -r '.tag_name // empty')" || VERSION=""
          if [ -z "$VERSION" ]; then
            echo "::warning::could not resolve the latest release (none published?); building from main"
            VERSION="main"
          fi
        fi

        # Only tagged releases have prebuilt binaries; anything else is a git ref.
        TARGET=""
        if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  TARGET="x86_64-unknown-linux-gnu" ;;
            Linux-aarch64) TARGET="aarch64-unknown-linux-gnu" ;;
            Darwin-arm64)  TARGET="aarch64-apple-darwin" ;;
          esac
        fi

        if [ -n "$TARGET" ]; then
          ASSET="stepshots-${VERSION}-${TARGET}.tar.gz"
          URL="https://github.com/$REPO/releases/download/${VERSION}/${ASSET}"
          BIN_DIR="$RUNNER_TEMP/stepshots-bin"

          if curl -fsSL --retry 3 -o "$ASSET" "$URL" \
            && curl -fsSL --retry 3 -o "${ASSET}.sha256" "${URL}.sha256"; then

            EXPECTED="$(awk '{print $1}' "${ASSET}.sha256")"
            ACTUAL="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::checksum mismatch for ${ASSET}: expected ${EXPECTED}, got ${ACTUAL}"
              exit 1
            fi

            mkdir -p "$BIN_DIR"
            tar -xzf "$ASSET" --strip-components=1 -C "$BIN_DIR"
            chmod +x "$BIN_DIR/stepshots"
            rm -f "$ASSET" "${ASSET}.sha256"
            echo "$BIN_DIR" >> "$GITHUB_PATH"

            echo "from-source=false" >> "$GITHUB_OUTPUT"
            echo "Installed prebuilt stepshots ${VERSION} (${TARGET})"
            exit 0
          fi

          echo "::warning::no prebuilt binary for ${VERSION}/${TARGET}; falling back to a source build"
        fi

        echo "from-source=true" >> "$GITHUB_OUTPUT"
        echo "cargo-ref=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      if: steps.install.outputs.from-source == 'true'
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
      with:
        toolchain: stable

    - name: Cache Rust build
      if: steps.install.outputs.from-source == 'true'
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: true

    - name: Build Stepshots CLI from source
      if: steps.install.outputs.from-source == 'true'
      shell: bash
      env:
        CARGO_REF: ${{ steps.install.outputs.cargo-ref }}
        GIT_URL: https://github.com/hauju/stepshots.git
      run: |
        set -euo pipefail
        # cargo install has no --ref; pick the flag that matches the ref shape.
        if [[ "$CARGO_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          cargo install --locked --git "$GIT_URL" --tag "$CARGO_REF" stepshots-cli
        elif [[ "$CARGO_REF" =~ ^[0-9a-f]{7,40}$ ]]; then
          cargo install --locked --git "$GIT_URL" --rev "$CARGO_REF" stepshots-cli
        else
          cargo install --locked --git "$GIT_URL" --branch "$CARGO_REF" stepshots-cli
        fi

    - name: Install Chrome
      uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1
      with:
        chrome-version: stable

    - name: Record tutorials
      if: inputs.command == 'record'
      id: record
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_TUTORIALS: ${{ inputs.tutorials }}
      run: |
        ARGS=(--config "$INPUT_CONFIG" --output "$INPUT_OUTPUT")

        if [ -n "$INPUT_TUTORIALS" ]; then
          IFS=',' read -ra TUTORIALS <<< "$INPUT_TUTORIALS"
          for t in "${TUTORIALS[@]}"; do
            trimmed="${t#"${t%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            ARGS+=(--tutorial "$trimmed")
          done
        fi

        stepshots record "${ARGS[@]}"

        {
          echo "bundles<<EOF"
          find "$INPUT_OUTPUT" -name "*.stepshot" -type f
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Verify tutorials
      if: inputs.command == 'verify'
      id: verify
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_TUTORIALS: ${{ inputs.tutorials }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ON_DRIFT: ${{ inputs.on-drift }}
        INPUT_TOKEN: ${{ inputs.token }}
        STEPSHOTS_SERVER: ${{ inputs.server }}
      run: |
        # An empty token must not reach the CLI as a (blank) credential.
        if [ -n "$INPUT_TOKEN" ]; then
          export STEPSHOTS_TOKEN="$INPUT_TOKEN"
        fi

        ARGS=(--config "$INPUT_CONFIG" --save-failures "$INPUT_OUTPUT" --fail-on "$INPUT_FAIL_ON")

        if [ -n "$INPUT_TUTORIALS" ]; then
          IFS=',' read -ra TUTORIALS <<< "$INPUT_TUTORIALS"
          for t in "${TUTORIALS[@]}"; do
            trimmed="${t#"${t%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            ARGS+=(--tutorial "$trimmed")
          done
        fi

        mkdir -p "$INPUT_OUTPUT"
        REPORT="$INPUT_OUTPUT/verify-report.json"

        EXIT=0
        stepshots verify "${ARGS[@]}" --json > "$REPORT" || EXIT=$?
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"

        if jq -e '.summary' "$REPORT" > /dev/null 2>&1; then
          {
            echo "## Demo freshness"
            jq -r '"\(.summary.ok) fresh · \(.summary.warn) warning(s) · \(.summary.fail) broken"' "$REPORT"
            echo ""
            jq -r '.tutorials[] |
              if .status == "fail" then
                "- ❌ `\(.key)` — " + ((.error // ([.steps[] | select(.status == "fail")][0])) | "\(.message)\n  - hint: \(.hint)")
              elif .status == "warn" then
                "- ⚠️ `\(.key)` — \(.annotation_warnings | length) annotation(s) drifted"
              else
                "- ✅ `\(.key)` — ok"
              end' "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"
        else
          # The CLI failed before producing a report (config/browser error) —
          # surface the error JSON in the log.
          cat "$REPORT"
        fi

        # Pull-request mode: hand the affected tutorials to the re-record step
        # instead of failing here. Only when verify produced a report — a
        # config or browser error still fails the step.
        if [ "$INPUT_ON_DRIFT" = "pull-request" ] && [ "$EXIT" -ne 0 ] \
          && jq -e '.summary' "$REPORT" > /dev/null 2>&1; then
          AFFECTED="$(jq -r '[.tutorials[] | select(.status != "ok") | .key] | join(",")' "$REPORT")"
          if [ -n "$AFFECTED" ]; then
            echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"
            echo "::warning::demos no longer match the app ($AFFECTED) — re-recording for a pull request"
            exit 0
          fi
        fi

        exit "$EXIT"

    - name: Re-record drifted tutorials
      if: inputs.command == 'verify' && inputs.on-drift == 'pull-request' && steps.verify.outputs.affected != ''
      id: rerecord
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BUNDLES_DIR: ${{ inputs.bundles-dir }}
        AFFECTED: ${{ steps.verify.outputs.affected }}
        VERIFY_REPORT: ${{ steps.verify.outputs.report }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        BRANCH: stepshots/re-record
      run: |
        set -uo pipefail
        ARGS=(--config "$INPUT_CONFIG" --output "$INPUT_BUNDLES_DIR")
        IFS=',' read -ra KEYS <<< "$AFFECTED"
        for k in "${KEYS[@]}"; do ARGS+=(--tutorial "$k"); done

        # Keep going on failure: a tutorial whose step no longer runs can't be
        # re-recorded from the same config, but the others still can.
        mkdir -p "$INPUT_BUNDLES_DIR"
        RECORD_REPORT="$RUNNER_TEMP/stepshots-rerecord.json"
        stepshots record "${ARGS[@]}" --json > "$RECORD_REPORT" || true

        DIR="${INPUT_BUNDLES_DIR#./}"
        BODY="$RUNNER_TEMP/stepshots-pr-body.md"
        {
          echo "\`stepshots verify\` found demos that no longer match the app at ${SHA:0:7}. This PR re-records them."
          echo ""
        } > "$BODY"

        PATHS=()
        RECORDED=0
        for k in "${KEYS[@]}"; do
          echo "### \`$k\`" >> "$BODY"
          jq -r --arg k "$k" '.tutorials[] | select(.key == $k) |
            ([.steps[] | select(.status == "fail") | "- step \(.index + 1): \(.action) — \(.message)"]
             + [.annotation_warnings[]? | "- step \(.step + 1): \(.kind) `\(.selector)` drifted"]
             + (if .error then ["- start page: \(.error.message)"] else [] end))[]' \
            "$VERIFY_REPORT" >> "$BODY"

          OUT="$(jq -r --arg k "$k" '.tutorials[]? | select(.key == $k) | .output // empty' "$RECORD_REPORT")"
          if [ -n "$OUT" ] && [ -f "$OUT" ]; then
            stepshots sheet "$OUT"
            PATHS+=("$DIR/$k.stepshot" "$DIR/$k.sheet.png")
            RECORDED=$((RECORDED + 1))
            echo "" >> "$BODY"
            echo "![$k contact sheet](https://github.com/$REPO/blob/$BRANCH/$DIR/$k.sheet.png?raw=true)" >> "$BODY"
          else
            echo "- ⚠️ could not be re-recorded — a step no longer runs; update this tutorial in the config" >> "$BODY"
            echo "::warning::could not re-record $k; it needs a config fix"
          fi
          echo "" >> "$BODY"
        done

        if [ "$RECORDED" -eq 0 ]; then
          echo "::error::no affected tutorial could be re-recorded — update the config (see the verify report)"
          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        echo "body-path=$BODY" >> "$GITHUB_OUTPUT"
        {
          echo "paths<<EOF"
          printf '%s\n' "${PATHS[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Open drift pull request
      if: steps.rerecord.outputs.body-path != ''
      id: drift_pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ inputs.pr-token }}
        # pull_request checkouts are a detached HEAD; create-pull-request then
        # needs the base named explicitly or it refuses to open the PR.
        base: ${{ github.head_ref || github.ref_name }}
        branch: stepshots/re-record
        delete-branch: true
        add-paths: ${{ steps.rerecord.outputs.paths }}
        commit-message: "chore(demos): re-record demos that drifted from the app"
        title: "Re-record demos that no longer match the app"
        body-path: ${{ steps.rerecord.outputs.body-path }}

    - name: Check guided tours
      if: inputs.command == 'tour-check'
      id: tour_check
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_TOURS: ${{ inputs.tours }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_UPDATE_FALLBACKS: ${{ inputs.update-fallbacks }}
      run: |
        if [ -z "$INPUT_URL" ]; then
          echo "::error::the 'url' input is required when command is tour-check"
          exit 1
        fi

        ARGS=(--url "$INPUT_URL" --fail-on "$INPUT_FAIL_ON")
        if [ "$INPUT_UPDATE_FALLBACKS" = "true" ]; then
          ARGS+=(--update-fallbacks)
        fi

        if [ -n "$INPUT_TOURS" ]; then
          IFS=',' read -ra TOURS <<< "$INPUT_TOURS"
          for t in "${TOURS[@]}"; do
            trimmed="${t#"${t%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            ARGS+=("$trimmed")
          done
        fi

        mkdir -p "$INPUT_OUTPUT"
        REPORT="$INPUT_OUTPUT/tour-check-report.json"

        EXIT=0
        stepshots tour check "${ARGS[@]}" --json > "$REPORT" || EXIT=$?
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"

        if jq -e '.summary' "$REPORT" > /dev/null 2>&1; then
          {
            echo "## Tour freshness"
            jq -r '"\(.summary.ok) ok · \(.summary.drift) drifted · \(.summary.fail) broken (against \(.url))"' "$REPORT"
            echo ""
            jq -r '.tours[] |
              ([.steps[] | select(.status == "fail")] | length) as $fails |
              ([.steps[] | select(.status == "drift")] | length) as $drifts |
              if $fails > 0 then
                ([.steps[] | select(.status == "fail")][0]) as $s |
                "- ❌ `\(.key)` — step \($s.index + 1) (\($s.title)) failed" + (if $s.detail then ": \($s.detail)" else "" end)
              elif $drifts > 0 then
                "- ⚠️ `\(.key)` — \($drifts) step(s) resolved by fallback anchor (selector drift)"
              else
                "- ✅ `\(.key)` — ok"
              end' "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"
        else
          # The CLI failed before producing a report (config/browser error) —
          # surface the error JSON in the log.
          cat "$REPORT"
        fi

        exit "$EXIT"

    - name: Upload bundles
      if: inputs.upload == 'true' && inputs.command == 'record'
      shell: bash
      env:
        STEPSHOTS_TOKEN: ${{ inputs.token }}
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_DEMO_ID: ${{ inputs.demo-id }}
        INPUT_TITLE: ${{ inputs.title }}
      run: |
        UPLOAD_ARGS=()
        if [ -n "$INPUT_DEMO_ID" ]; then
          UPLOAD_ARGS+=(--demo-id "$INPUT_DEMO_ID")
        fi
        if [ -n "$INPUT_TITLE" ]; then
          UPLOAD_ARGS+=(--title "$INPUT_TITLE")
        fi

        while IFS= read -r bundle; do
          [ -z "$bundle" ] && continue
          stepshots upload "$bundle" --server "$INPUT_SERVER" "${UPLOAD_ARGS[@]}"
        done <<< "${{ steps.record.outputs.bundles }}"
