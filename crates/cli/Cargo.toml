[package]
name = "stepshots-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "CLI for recording, bundling, and uploading Stepshots demos"

[[bin]]
name = "stepshots"
path = "src/main.rs"

[dependencies]
manifest = { path = "../manifest", version = "1.5.0", package = "stepshots-manifest", features = ["schema"] }
schemars = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util"] }
futures = "0.3"

# Browser automation
chromiumoxide = "0.9"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Bundling
zip = { version = "8.2", default-features = false, features = ["deflate"] }

# HTTP client (for upload)
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "json"] }

# HTTP server (for serve command)
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Progress & terminal
indicatif = "0.17"
console = "0.15"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15.7"
semver = "1"

# CLI login (OAuth PKCE loopback flow)
open = "5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
